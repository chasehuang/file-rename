name: File Rename
identifier: com.chasehuang.popclip.file-rename
description: Translate filenames or name images and videos from their content. Preview before applying.
keywords: file rename filename rename translate gemini image video finder
popclipVersion: 6221
icon: file:icons/file-rename.svg
requirements: [text]
module: main.js
entitlements: [network, script]
shellScriptRationale: Reads the selected Finder file, verifies its identity, creates metadata-stripped image copies with built-in macOS ImageIO, extracts video frames with ffmpeg, and performs exclusive filesystem renames. Optional dotenv credentials are read from a user-selected local file.
options:
  - identifier: geminiApiKey
    type: secret
    label: Gemini API Key
    keychain: local
    description: "Your own Google Gemini API key, saved in this Mac's Keychain. For a .env file, leave this blank and enter its path below."
  - identifier: envFile
    type: string
    label: ".env path (optional)"
    description: "Used only when API Key is blank. Enter an absolute path or a path starting with ~/. No file is read if both fields are blank."
